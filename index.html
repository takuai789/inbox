<!DOCTYPE html>
<html lang="ja" data-theme="navy">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<meta name="theme-color" content="#F2F2F7" id="themeColor" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232E3A59'/%3E%3Cstop offset='1' stop-color='%23161C2E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M14 34h10l3 6h10l3-6h10v12a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z' fill='%23F5B942'/%3E%3Cpath d='M19 16h26l5 16H40l-3 6H27l-3-6H14z' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
<title>INBOX</title>
<script>
  // 保存してある色を、描画の前に当てる（ちらつき防止）
  try { const t = localStorage.getItem('inbox.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* ---------- カラー（5種類） ---------- */
  :root, [data-theme="navy"] {
    --bg: #F2F2F7; --card: #FFFFFF; --ink: #1C1C1E; --accent: #2E3A59; --accent-ink: #FFFFFF;
    --secondary: rgba(28,34,53,0.55); --tertiary: rgba(28,34,53,0.3); --sep: rgba(28,34,53,0.1); --chip: rgba(28,34,53,.07);
    --glass: rgba(242,242,247,.94);
  }
  [data-theme="turquoise"] {
    --bg: #ECF6F5; --card: #FFFFFF; --ink: #10302F; --accent: #0E9494; --accent-ink: #FFFFFF;
    --secondary: rgba(16,48,47,0.55); --tertiary: rgba(16,48,47,0.3); --sep: rgba(16,48,47,0.1); --chip: rgba(14,148,148,.1);
    --glass: rgba(236,246,245,.94);
  }
  [data-theme="sakura"] {
    --bg: #F9F1F2; --card: #FFFFFF; --ink: #3A2229; --accent: #C2557A; --accent-ink: #FFFFFF;
    --secondary: rgba(58,34,41,0.55); --tertiary: rgba(58,34,41,0.3); --sep: rgba(58,34,41,0.1); --chip: rgba(194,85,122,.09);
    --glass: rgba(249,241,242,.94);
  }
  [data-theme="mori"] {
    --bg: #F0F3EC; --card: #FFFFFF; --ink: #1F2E22; --accent: #3D7A4E; --accent-ink: #FFFFFF;
    --secondary: rgba(31,46,34,0.55); --tertiary: rgba(31,46,34,0.3); --sep: rgba(31,46,34,0.1); --chip: rgba(61,122,78,.09);
    --glass: rgba(240,243,236,.94);
  }
  [data-theme="sumi"] {
    --bg: #15171C; --card: #22252D; --ink: #ECEDF0; --accent: #8EA8FF; --accent-ink: #11131A;
    --secondary: rgba(236,237,240,0.55); --tertiary: rgba(236,237,240,0.28); --sep: rgba(236,237,240,0.09); --chip: rgba(236,237,240,.08);
    --glass: rgba(21,23,28,.94);
  }
  :root {
    --amber: #F5B942; --amber-deep: #D99A1C; --red: #E5484D; --green: #2FA36B;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="sumi"] { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', sans-serif; color: var(--ink); font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  /* iPhone でキーボードが出たとき、画面がずれて真っ白にならないよう、見えている範囲（visualViewport）にぴったり固定する */
  #app { position: fixed; left: 0; right: 0; top: 0; height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-top); max-width: 640px; margin: 0 auto; }

  /* 見出し（iPhoneの大きなタイトル） */
  .top { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px 6px 20px; min-height: 64px; }
  .top .ttl { flex: 1; min-width: 0; }
  .top h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; color: var(--ink); line-height: 1.15; }
  .top .count { font-size: 13px; color: var(--secondary); font-weight: 500; margin-top: 1px; display: block; min-height: 18px; }
  .top .back { border: 0; background: none; color: var(--accent); font: inherit; font-size: 17px; cursor: pointer; display: flex; align-items: center; gap: 0; padding: 6px 4px 6px 0; margin-left: -6px; }
  .top.sub { flex-direction: column; align-items: stretch; gap: 0; padding-top: 4px; }
  .top.sub .navrow { display: flex; align-items: center; min-height: 40px; }
  .top.sub h1 { font-size: 30px; }
  .top .tools { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
  .tbtn { position: relative; height: 38px; min-width: 38px; padding: 0 6px; border: 0; background: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; }
  .tbtn:active { background: var(--chip); }
  .tbtn svg { width: 23px; height: 23px; }
  .tbtn span { font-variant-numeric: tabular-nums; }
  .emptyTrash { border: 0; background: none; color: var(--red); font: inherit; font-size: 16px; cursor: pointer; padding: 6px 8px; margin-left: auto; }
  .emptyTrash:disabled { opacity: .3; }

  /* すべて / ★ */
  .seg { margin: 4px 16px 12px; display: grid; grid-template-columns: 1fr 1fr; background: rgba(118,118,128,.12); border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: none; font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); padding: 6px 0; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--card); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04); }
  .seg button .st { color: var(--amber-deep); }

  /* 入力欄（上：キーボードに隠れない・押し上げられない） */
  .composer { flex-shrink: 0; margin: 0 16px 14px; background: var(--card); border-radius: 12px; display: flex; align-items: flex-start; gap: 10px; padding: 11px 10px 11px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); border: 1.5px solid transparent; transition: border-color .15s; }
  .composer.focus { border-color: var(--accent); }
  .composer .plus { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .composer textarea { flex: 1; min-width: 0; font: inherit; font-size: 17px; line-height: 1.5; border: 0; background: none; outline: none; color: var(--ink); resize: none; height: 26px; max-height: 128px; overflow-y: auto; -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; padding: 0; }
  .composer textarea::placeholder { color: var(--tertiary); }
  .composer .add { flex-shrink: 0; height: 28px; padding: 0 12px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: none; align-items: center; }
  .composer.has .add { display: flex; }
  body.view-done .composer, body.view-trash .composer, body.view-done .seg, body.view-trash .seg { display: none; }

  /* 一覧 */
  .list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--kb, 0px) + var(--safe-bottom) + 90px); }
  .vhint { font-size: 13px; color: var(--secondary); margin: 0 4px 10px; line-height: 1.6; }
  .day { font-size: 13px; font-weight: 600; color: var(--secondary); margin: 18px 16px 6px; display: flex; gap: 8px; }
  .day:first-child, .vhint + .day { margin-top: 2px; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { position: relative; overflow: hidden; }
  .row + .row::before { content: ''; position: absolute; left: 50px; right: 0; top: 0; height: .5px; background: var(--sep); z-index: 2; }
  .row .bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 15px; font-weight: 700; color: #fff; }
  .row .bg .l { opacity: 0; } .row .bg .r { opacity: 0; }
  .row.sw-right .bg { background: var(--green); } .row.sw-right .bg .l { opacity: 1; }
  .row.sw-left .bg { background: var(--red); } .row.sw-left .bg .r { opacity: 1; }
  .row.sw-right.back .bg { background: var(--accent); }
  .row .inner { position: relative; z-index: 1; background: var(--card); display: flex; align-items: center; gap: 12px; padding: 11px 6px 11px 14px; min-height: 50px; touch-action: pan-y; transition: transform .22s ease; }
  .row .inner.drag { transition: none; }
  .row .chk { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--tertiary); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; padding: 0; transition: all .18s; position: relative; }
  .row .chk::after { content: ''; position: absolute; inset: -10px; }
  .row .chk { touch-action: manipulation; }
  /* 1回目のタップ：もう一度で完了 */
  .row.armed .chk { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); animation: armed .9s ease-in-out infinite; }
  .row.armed .chk { position: relative; }
  .row.armed .chk::before { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); }
  @keyframes armed { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 10%, transparent); } }
  .row .chk svg { width: 14px; height: 14px; }
  .row.checking .chk, .row.done .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .row.checking .t { color: var(--secondary); }
  .row.done .chk { background: var(--secondary); border-color: transparent; }
  .row .t { flex: 1; min-width: 0; font-size: 17px; line-height: 1.45; word-break: break-word; }
  .row.done .t { color: var(--secondary); }
  .row.trash .t { color: var(--secondary); }
  .row.fresh .inner { animation: fresh 1.2s ease; }
  @keyframes fresh { 0% { background: color-mix(in srgb, var(--accent) 14%, var(--card)); } 100% { background: var(--card); } }
  .row .when { font-size: 12px; color: var(--tertiary); white-space: nowrap; }
  .row .edit { flex: 1; min-width: 0; display: block; font: inherit; font-size: 17px; line-height: 1.45; border: 0; outline: none; background: rgba(245,185,66,.16); border-radius: 10px; padding: 6px 10px; margin: -6px -10px; color: var(--ink); -webkit-appearance: none; appearance: none; resize: none; overflow: hidden; height: auto; word-break: break-word; }
  .row .star, .row .undo { flex-shrink: 0; width: 40px; height: 40px; border: 0; background: none; cursor: pointer; color: rgba(60,60,67,.22); display: flex; align-items: center; justify-content: center; }
  [data-theme="sumi"] .row .star { color: rgba(236,237,240,.25); }
  .row .star svg { width: 21px; height: 21px; }
  .row .undo { color: var(--accent); }
  .row .undo svg { width: 20px; height: 20px; }
  .row.fav .star { color: var(--amber); }
  .row.fav .star svg path { fill: var(--amber); }
  .row .star:active svg { transform: scale(.85); }
  .empty { text-align: center; color: var(--secondary); font-size: 15px; line-height: 1.9; padding: 56px 20px; }
  .empty b { display: block; font-size: 34px; margin-bottom: 6px; }
  .empty small { display: block; font-size: 12.5px; opacity: .85; margin-top: 8px; }

  /* 親指で押せる「＋」（押すと上の入力欄にカーソル） */
  .fab { position: fixed; right: max(18px, calc(50% - 302px)); bottom: calc(var(--safe-bottom) + 22px); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(0,0,0,.22); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; transition: transform .2s, opacity .2s; }
  .fab:active { transform: scale(.92); }
  .fab svg { width: 28px; height: 28px; }
  body.typing .fab, body.view-done .fab, body.view-trash .fab { opacity: 0; pointer-events: none; transform: scale(.6); }

  /* トースト（上：キーボードに隠れない） */
  .toast { position: fixed; left: 50%; bottom: calc(var(--kb, 0px) + var(--safe-bottom) + 96px); transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; background: #1C2235; color: #fff; border-radius: 12px; padding: 10px 10px 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: all .25s; z-index: 50; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { border: 0; background: rgba(255,255,255,.16); color: var(--amber); font: inherit; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .toast button:empty { display: none; }

  /* 確認ダイアログ（iPhoneのホーム画面アプリでは confirm が出ないことがあるため自前） */
  .dlgBg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 80; padding: 24px; }
  .dlgBg.show { display: flex; }
  .dlg { background: var(--card); color: var(--ink); border-radius: 16px; padding: 20px 18px 14px; width: 100%; max-width: 320px; text-align: center; }
  .dlg p { font-size: 15px; line-height: 1.7; margin-bottom: 16px; }
  .dlg .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dlg button { border: 0; border-radius: 10px; padding: 11px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--chip); color: var(--ink); }
  .dlg button.danger { background: var(--red); color: #fff; }

  /* 設定 */
  .sheetBg { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
  .sheetBg.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 10px 16px calc(var(--safe-bottom) + 18px); transform: translateY(105%); transition: transform .3s cubic-bezier(.32,.72,0,1); z-index: 61; }
  .sheet.show { transform: translateY(0); }
  .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 12px; }
  .sheet h3 { font-size: 16px; text-align: center; margin-bottom: 14px; }
  .slabel { font-size: 12px; font-weight: 700; color: var(--secondary); margin: 0 4px 8px; }
  .themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
  .themes button { border: 2px solid transparent; background: var(--card); border-radius: 12px; padding: 10px 0 8px; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .themes button i { width: 26px; height: 26px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 3px rgba(255,255,255,.55); }
  .themes button.on { border-color: var(--accent); }
  .sgroup { background: var(--card); border-radius: 12px; overflow: hidden; }
  .sgroup button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; font-size: 15px; color: var(--accent); padding: 14px 16px; cursor: pointer; }
  .sgroup button + button { border-top: .5px solid var(--sep); }
  .snote { font-size: 12px; color: var(--secondary); line-height: 1.7; margin: 10px 4px 0; }
  .snote.due { color: #B4651A; font-weight: 700; }
  #versionLabel { text-align: center; font-size: 12px; color: var(--tertiary); margin-top: 14px; }

  #updateBanner { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 16px); z-index: 1000; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 14px 18px; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 8px 28px rgba(0,0,0,.3); cursor: pointer; transform: translateY(140%); transition: transform .35s cubic-bezier(.32,.72,0,1); }
  #updateBanner.show { transform: translateY(0); }
  #updateBanner svg { display: block; flex-shrink: 0; }
</style>
<script>/* iPhoneが容量不足のときに保存データを消さないよう、端末にお願いしておく */try{navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(function(p){if(!p)navigator.storage.persist();});}catch(e){}</script>

<body class="view-inbox">
<div id="app">
  <div class="top" id="top"></div>
  <div class="seg" id="seg">
    <button data-f="all" class="on">すべて</button>
    <button data-f="fav"><span class="st">★</span> お気に入り</button>
  </div>
  <form class="composer" id="composer">
    <span class="plus" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <textarea id="input" rows="1" placeholder="気になったこと・やること" enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="add" id="addBtn" type="submit" aria-label="追加">追加</button>
  </form>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="fab" aria-label="書く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="toast" id="toast"><span></span><button></button></div>
<div class="dlgBg" id="dlgBg"><div class="dlg"><p id="dlgMsg"></p><div class="btns"><button id="dlgNo">やめる</button><button class="danger" id="dlgYes">削除する</button></div></div></div>

<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>INBOX</h3>
  <div class="slabel">カラー</div>
  <div class="themes" id="themes"></div>
  <div class="sgroup">
    <button id="exportBtn">データを書き出す（バックアップ）</button>
    <button id="importBtn">データを取り込む</button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <p class="snote" id="bkNote"></p>
  <p class="snote">左の ○ を押すか右にスワイプで完了、左にスワイプでゴミ箱。文字をタップすると書き直せます。何行かまとめて貼りつけると、1行ずつ別の項目になります。</p>
  <div id="versionLabel"></div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- IndexedDB（DB名は変えない） ----------
  const DB_NAME = 'inbox-db', DB_VERSION = 1, STORES = ['items'];
  let _db = null;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => { const db = req.result; for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }
  const tx = (store, mode = 'readonly') => _db.transaction(store, mode).objectStore(store);
  const getAll = (s) => new Promise((res, rej) => { const r = tx(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const put = (s, v) => new Promise((res, rej) => { const r = tx(s, 'readwrite').put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  const del = (s, id) => new Promise((res, rej) => { const r = tx(s, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });

  // ---------- バージョン（sw.js の CACHE とセットで上げる） ----------
  const APP_VERSION = '1.8.0';

  // ---------- 状態 ----------
  // item: { id, title, fav, createdAt, updatedAt, status: undefined(=受け箱) | 'done' | 'trash', doneAt, trashedAt }
  const state = { items: [], filter: 'all', view: 'inbox', editing: null, editCaret: null };
  let freshId = null;
  const FILTER_KEY = 'inbox.filter';
  try { if (localStorage.getItem(FILTER_KEY) === 'fav') state.filter = 'fav'; } catch (e) {}
  async function loadAll() { state.items = await getAll('items'); }
  const statusOf = (i) => i.status === 'done' ? 'done' : i.status === 'trash' ? 'trash' : 'inbox';
  const whenOf = (i, view) => view === 'done' ? (i.doneAt || i.updatedAt) : view === 'trash' ? (i.trashedAt || i.updatedAt) : i.createdAt;

  // ---------- 日付の区切り（今月／先月／今年／昨年／N年前） ----------
  function bucketOf(ts) {

        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'ok'; }
      } catch (e) { if (e && e.name === 'AbortError') return (await bkAskSaved()) ? 'ok' : 'cancel'; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'ok';
  }
  const BK_KEY = 'inbox.lastBackupAt';
  function bkText() { let t = 0; try { t = Number(localStorage.getItem(BK_KEY) || 0); } catch (e) {} if (!t) return 'まだ一度もバックアップしていません'; const d = Math.floor((Date.now() - t) / 86400000); return d === 0 ? '前回のバックアップ：今日' : '前回のバックアップから ' + d + '日'; }
  function bkDue() { let t = 0; try { t = Number(localStorage.getItem(BK_KEY) || 0); } catch (e) {} return !t || Date.now() - t >= 30 * 86400000; }
  const SCHEMA = 'inbox.v1';
  $('#exportBtn').addEventListener('click', async () => {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), items: state.items };
    if (await bkSave('INBOX', JSON.stringify(data, null, 2)) !== 'ok') return;
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {}
    renderSheet(); toast('書き出しました');
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.schema !== SCHEMA) { toast('INBOXのデータではないようです'); return; }
      const byId = new Map(state.items.map((x) => [x.id, x])); let n = 0;
      for (const it of (data.items || [])) { const l = byId.get(it.id); if (!l || (it.updatedAt || 0) > (l.updatedAt || 0)) { await put('items', it); n++; } }
      await loadAll(); render(); closeSheet(); toast(n + '件 取り込みました');
    } catch (err) { toast('取り込めませんでした'); }
  });

  // ---------- 設定シート ----------
  function renderSheet() { const n = $('#bkNote'); n.textContent = bkText(); n.classList.toggle('due', bkDue() && state.items.length > 0); $('#versionLabel').textContent = 'v' + APP_VERSION; renderThemes(); }
  function openSheet() { renderSheet(); input.blur(); $('#sheetBg').classList.add('show'); $('#sheet').classList.add('show'); }
  function closeSheet() { $('#sheetBg').classList.remove('show'); $('#sheet').classList.remove('show'); }
  $('#sheetBg').addEventListener('click', closeSheet);

  // ---------- 起動 ----------
  (async function init() {
    setupViewportTracking();
    applyTheme(document.documentElement.dataset.theme || 'navy');
    await openDB(); await loadAll(); render();
    // iPhone/iPad では自動でフォーカスしない（キーボードが出ないまま「フォーカス済み」になり、タップしても入力できなくなるため）
    if (!(navigator.maxTouchPoints > 0)) setTimeout(() => input.focus(), 150);
  })();

  // ---------- キーボード対策 ----------
  // 入力欄は上にあるので、画面は動かさない。キーボードの高さだけ測って、一覧の下に余白をつける（最後まで見られるように）
  function setupViewportTracking() {
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement;
    const apply = () => {
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      root.style.setProperty('--kb', kb + 'px');
      // iPhone が勝手に画面をずらしたら戻す
      if (window.scrollY || document.documentElement.scrollTop) window.scrollTo(0, 0);
    };
    vv.addEventListener('resize', apply); vv.addEventListener('scroll', apply);
    document.addEventListener('focusin', () => setTimeout(apply, 300));
    document.addEventListener('focusout', () => setTimeout(apply, 300));
    apply();
  }

  // ---------- Service Worker + 自動アップデート ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const res = await fetch(new URL('sw.js', location.href).href, { method: 'HEAD' }); if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => { const sw = reg.installing; if (!sw) return; sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); }); });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; window.location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(waitingSW) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button'); b.id = 'updateBanner';
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span>新しいバージョンがあります — タップで更新</span>';
    b.addEventListener('click', () => { b.disabled = true; b.querySelector('span').textContent = '更新中…'; waitingSW.postMessage('SKIP_WAITING'); });
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
